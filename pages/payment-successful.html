<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
	<title>Цветы</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<link rel="stylesheet" href="../style.css">
	<link rel="shortcut icon" href="../circles.ico">

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap" rel="stylesheet">

	<script src="https://use.fontawesome.com/c61f48834a.js"></script>

</head>

<body>
	<div class="container">
		
		<div class="payment-success-wrapper-item">
			<div class="payment-success-check">
				<div class="psc-body">
					<div class="psc-header">
						<span>Чек №1 236</span>
						<span>28 янв 2026, 09:52</span>
					</div>
					<div class="psc-info">
						<img src="../img/check-success.svg" class="icon" />
						<p class="title">Успешная оплата</p>
						<p class="subtitle">Отдайте чек клиенту</p>
						<div class="payments">
							<div class="item">
								<p class="text">Сумма заказа:</p>
								<p class="val w-rub">2 506</p>
							</div>
							<div class="item">
								<p class="text">Скидка:</p>
								<p class="val w-rub">- 300</p>
							</div>
							<div class="item item-total">
								<p class="text">Оплата:</p>
								<p class="val w-rub">2 456</p>
							</div>
						</div>
						<div class="note">
							<p>Вы дополнительно заработали:</p>
							<span class="w-rub">+ 300</span>
						</div>
					</div>
				</div>				
				<button class="psc-footer">
					<img src="../img/check.svg" class="icon" />
					<p>Распечатать чек</p>
				</button>
			</div>
			<div class="payment-success-btns">
				<button class="btn"><img src="../img/plus.svg" /> еще одна покупка</button>
				<button class="btn">Следующая продажа <img src="../img/chevron-right.svg" /></button>
			</div>
		</div>

	</div>
</body>

<script src="../script/jquery-3.3.1.min.js"></script>
<script src="../script/main.js"></script>
<script src="../script/scrollbooster.min.js"></script> <!-- скрипт для создания скроллов -->

</html>
